<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <title>結婚パーティ・サウンドトラック | 大野物産株式会社</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --panel: #202020;
      --panel-2: #181818;
      --text: #f5f5f5;
      --muted: #b3b3b3;
      --green: #1ed760;
      --border: #343434;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }
    .player {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 24px;
      background: linear-gradient(145deg, #242424, #191919);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, .82fr);
      gap: 28px;
      align-items: stretch;
    }
    .music { min-width: 0; }
    .track {
      display: grid;
      grid-template-columns: minmax(120px, 42%) minmax(0, 1fr);
      gap: 22px;
      align-items: center;
    }
    .cover {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
      background: #333;
    }
    .eyebrow {
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 10px 0 8px;
      font-size: clamp(22px, 3.5vw, 36px);
      line-height: 1.12;
      overflow-wrap: anywhere;
    }
    .artist { color: var(--muted); font-size: 15px; }
    audio { display: block; width: 100%; margin-top: 22px; }
    .lyrics-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 320px;
      padding: 18px;
      border-radius: 12px;
      background: rgba(0,0,0,.23);
    }
    .lyrics-heading {
      margin: 0 0 12px;
      font-size: 16px;
      letter-spacing: .04em;
    }
    .lyrics {
      min-height: 0;
      max-height: 360px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 10px;
      color: #e7e7e7;
      font-size: 14px;
      line-height: 1.95;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      scrollbar-width: thin;
      scrollbar-color: #666 transparent;
    }
    .lyrics::-webkit-scrollbar { width: 6px; }
    .lyrics::-webkit-scrollbar-thumb { background: #666; border-radius: 10px; }
    .note {
      margin: 18px 0 0;
      color: #888;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }
    @media (max-width: 700px) {
      body { padding: 10px 8px; }
      .player { padding: 16px; border-radius: 14px; }
      .layout { grid-template-columns: 1fr; gap: 22px; }
      .track { grid-template-columns: minmax(0, 1fr); gap: 16px; }
      .cover { width: min(100%, 360px); margin: 0 auto; }
      .info { text-align: center; }
      h1 { font-size: 27px; }
      audio { margin-top: 18px; }
      .lyrics-panel { min-height: 0; padding: 16px; }
      .lyrics { max-height: 280px; }
    }
  </style>
</head>
<body>
  <main class="player">
    <div class="layout">
      <section class="music" aria-label="音楽プレイヤー">
        <div class="track">
          <img class="cover" src="assets/cover.jpg" alt="アートカバー">
          <div class="info">
            <div class="eyebrow">Oh-No Corp RECORDS</div>
            <h1>結婚パーティ・サウンドトラック</h1>
            <div class="artist">大野物産株式会社</div>
          </div>
        </div>

        <audio controls preload="metadata">
          <source src="assets/song.mp3" type="audio/mpeg">
          お使いのブラウザは音声再生に対応していません。
        </audio>
      </section>

      <section class="lyrics-panel" aria-label="歌詞">
        <h2 class="lyrics-heading">LYRICS / 歌詞</h2>
        <div class="lyrics">ここに歌詞全文を入力してください。

1番

最初の歌詞を入力します。
次の歌詞を入力します。

サビ

サビの歌詞を入力します。
続きの歌詞を入力します。

2番

ここに2番の歌詞を入力します。
最後まで歌詞を入力してください。</div>
      </section>
    </div>
    <p class="note">PERSONAL MUSIC PLAYER</p>
  </main>
</body>
</html>
